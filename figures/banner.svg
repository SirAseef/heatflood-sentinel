      <stop offset="1" stop-color="#ffb13b"/>
    </linearGradient>
    <linearGradient id="flood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fa4ff"/>
      <stop offset="1" stop-color="#3be0d0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
