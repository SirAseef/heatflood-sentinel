[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heatflood-sentinel"
version = "0.1.0"
description = "Scalable Big Data and Deep Learning Framework for Heatwave and Flash-Flood Forecasting and Detection in Pakistan (MS thesis artefact)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aseef Ahmed" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "xarray>=2024.1", "netCDF4>=1.6", "dask[array]>=2024.1",
  "pyyaml>=6", "requests>=2.31", "scipy>=1.11", "scikit-learn>=1.4", "statsmodels>=0.14", "xgboost>=2.0",
  "torch>=2.1", "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5", "matplotlib>=3.8", "tabulate>=0.9",
]

[project.optional-dependencies]
stream = ["kafka-python>=2.0.2", "pyspark>=3.5,<4"]
era5 = ["cdsapi>=0.7.2"]
delta = ["deltalake>=0.17"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "playwright>=1.44"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:warnings"

[tool.ruff]
line-length = 170
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731", "B008", "B023", "E402", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["hfs"]
