# HeatFlood Sentinel - dev-lite stack (SRS 4.4). `make up`
# Kafka 3.7 in KRaft mode (no ZooKeeper), Spark 3.5 master+worker, API/dashboard, replay producer,
# Python stream consumer (shared StreamProcessor), live Open-Meteo producer.
x-app: &app
  build: { context: ., dockerfile: infra/docker/Dockerfile }
  env_file: [.env.example]
  environment:
    KAFKA_BOOTSTRAP: kafka:9092
  volumes: ["./data:/app/data", "./results:/app/results", "./models:/app/models"]

services:
  kafka:
    image: apache/kafka:3.7.0
    profiles: [dev-lite]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  topics:
    <<: *app
    profiles: [dev-lite]
    command: ["python", "-m", "hfs.streaming.producer", "--mode", "topics"]
    depends_on: { kafka: { condition: service_healthy } }
    restart: "no"

  api:
    <<: *app
    profiles: [dev-lite]
    ports: ["8000:8000"]
    depends_on: [kafka]

  producer-replay:
    <<: *app
    profiles: [dev-lite]
    command: ["python", "-m", "hfs.streaming.producer", "--mode", "replay", "--start", "2022-04-01", "--end", "2022-09-30 23:00", "--speed", "3600"]
    depends_on: { topics: { condition: service_completed_successfully } }

  producer-live:
    <<: *app
    profiles: [dev-lite]
    command: ["python", "-m", "hfs.streaming.producer", "--mode", "live", "--interval", "900"]
    depends_on: { topics: { condition: service_completed_successfully } }

  stream-consumer:
    <<: *app
    profiles: [dev-lite]
    command: ["python", "-m", "hfs.streaming.kafka_consumer"]
    restart: on-failure
    depends_on: { topics: { condition: service_completed_successfully } }

  spark-master:
    build: { context: ., dockerfile: infra/docker/Dockerfile.spark }
    profiles: [spark]
    environment: { SPARK_MODE: master }
    ports: ["7077:7077", "8080:8080"]
  spark-worker:
    build: { context: ., dockerfile: infra/docker/Dockerfile.spark }
    profiles: [spark]
    environment: { SPARK_MODE: worker, SPARK_MASTER_URL: "spark://spark-master:7077", SPARK_WORKER_CORES: 2, SPARK_WORKER_MEMORY: 2g }
    depends_on: [spark-master]
  spark-stream:
    build: { context: ., dockerfile: infra/docker/Dockerfile.spark }
    profiles: [spark]
    environment: { KAFKA_BOOTSTRAP: "kafka:9092", SPARK_MASTER_URL: "spark://spark-master:7077" }
    volumes: [".:/app"]
    command: ["bash", "/app/infra/spark/submit.sh"]
    restart: on-failure
    depends_on: [spark-master, kafka]
